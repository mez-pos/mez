name: Release

# A tag like v0.1.0, pushed, makes a release: the binaries, the Windows
# installer, the Docker image, their checksums and the notes. The release is
# left as a draft. A person reads it and presses Publish: see docs/releasing.md.
on:
  push:
    tags: ["v*"]

# Nothing by default. Each job asks for what it needs.
permissions: {}

# Two pushes of one tag would race to make one release.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: make check
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          # The version is `git describe`, which needs the tags.
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      # The frontends first: `make check` embeds what `web/*/dist` holds, and
      # a release is not made from a commit whose apps do not build.
      - run: make build-web
      - run: make check

  # The tablet app (ADR-421), built and signed with the human's key from the
  # repository's secrets, for the binaries and the image to carry. With no
  # key, no app: the release goes out without one, and its notes say so.
  app:
    name: tablet app
    needs: check
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      built: ${{ steps.key.outputs.built }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The version is `git describe`, and the code the commit count
          # (ADR-410): both need the whole history.
          fetch-depth: 0
      # The keystore is a secret, base64; it is written where only this job
      # reads it, and gone when the job ends. With a key, the key's
      # fingerprint must be named too, so that a wrong keystore in the
      # secrets is never a release that no tablet can update to.
      - id: key
        name: The release key
        shell: bash
        env:
          KEYSTORE: ${{ secrets.MEZ_ANDROID_KEYSTORE_BASE64 }}
          FINGERPRINT: ${{ vars.MEZ_ANDROID_KEY_SHA256 }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "built=no" >> "$GITHUB_OUTPUT"
            echo "::warning::no MEZ_ANDROID_KEYSTORE_BASE64 secret: this release carries no tablet app (docs/releasing.md)"
            exit 0
          fi
          if [ -z "$FINGERPRINT" ]; then
            echo "::error::a release key and no MEZ_ANDROID_KEY_SHA256 variable to check it by (docs/releasing.md)"
            exit 1
          fi
          umask 077
          printf '%s' "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/mez-release.jks"
          echo "built=yes" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v7
        if: steps.key.outputs.built == 'yes'
        with:
          go-version-file: go.mod
          check-latest: true
      # The Gradle daemon asks for JDK 25
      # (android-app/gradle/gradle-daemon-jvm.properties).
      - uses: actions/setup-java@v6
        if: steps.key.outputs.built == 'yes'
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        if: steps.key.outputs.built == 'yes'
      - name: Build and sign
        if: steps.key.outputs.built == 'yes'
        env:
          MEZ_ANDROID_KEYSTORE: ${{ runner.temp }}/mez-release.jks
          MEZ_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.MEZ_ANDROID_KEYSTORE_PASSWORD }}
          MEZ_ANDROID_KEY_ALIAS: ${{ secrets.MEZ_ANDROID_KEY_ALIAS }}
          MEZ_ANDROID_KEY_PASSWORD: ${{ secrets.MEZ_ANDROID_KEY_PASSWORD }}
          MEZ_ANDROID_KEY_SHA256: ${{ vars.MEZ_ANDROID_KEY_SHA256 }}
        run: make android-release
      - name: Forget the key
        if: always()
        run: rm -f "$RUNNER_TEMP/mez-release.jks"
      - uses: actions/upload-artifact@v7
        if: steps.key.outputs.built == 'yes'
        with:
          name: tablet-app
          path: internal/device/tabletapp/app/
          if-no-files-found: error
          retention-days: 7

  binaries:
    name: binaries
    needs: [check, app]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      # The tablet app, where `make dist` looks for it (ADR-421).
      - uses: actions/download-artifact@v8
        if: needs.app.outputs.built == 'yes'
        with:
          name: tablet-app
          path: internal/device/tabletapp/app
      # Every platform from this one machine: no cgo (ADR-003). The same
      # recipe anyone runs from a clone, so a release is checkable against it.
      - run: make dist
      - uses: actions/upload-artifact@v7
        with:
          name: binaries
          path: dist/
          if-no-files-found: error
          retention-days: 7

  installer:
    name: Windows installer
    needs: binaries
    runs-on: windows-2025
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: binaries
          path: dist
      # Inno Setup is on the runner's image some months and not others.
      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            choco install innosetup --no-progress -y
          }
      # What `make installer` runs, without make: the tag is the version, and
      # the binary is the one the job before this built. Not signed: there is
      # no certificate (ADR-265), and the release's notes say what Windows
      # will say about that.
      - name: Compile
        shell: pwsh
        # Through the environment, not written into the script: a tag's name
        # is text somebody chose.
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          $version = $env:VERSION
          if ($version -notmatch '^v[0-9][0-9A-Za-z.+-]*$') { throw "not a version: $version" }
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc /Q "/DVersion=$version" "/DBinary=..\..\dist\mez_${version}_windows_amd64.exe" build\installer\mez.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path "dist\mez_${version}_windows_amd64_setup.exe")) { throw "the installer was not made" }
      - uses: actions/upload-artifact@v7
        with:
          name: installer
          path: dist/*_setup.exe
          if-no-files-found: error
          retention-days: 7

  image:
    name: Docker image
    needs: [check, app]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # The tablet app, where the Dockerfile looks for it (ADR-421).
      - uses: actions/download-artifact@v8
        if: needs.app.outputs.built == 'yes'
        with:
          name: tablet-app
          path: internal/device/tabletapp/app
      # Docker's actions are somebody else's code, run in the one job that
      # may write packages. Each is pinned to the commit it was read at and
      # not to a tag, which its owner can move; Dependabot proposes the next
      # (.github/dependabot.yml).
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The version without its v, as image tags are written. No "latest":
      # the image is pushed before anyone has read the draft release, and a
      # venue that pulls "latest" should not be the one to find out it was
      # wrong. A venue names the version it wants.
      - id: tags
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "tags=ghcr.io/${GITHUB_REPOSITORY}:${version}" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "date=$(git show -s --format=%cI HEAD)" >> "$GITHUB_OUTPUT"
      # Both architectures from this one: the Dockerfile builds on the
      # runner's own and has Go cross-compile, so nothing runs under emulation.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: build/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ steps.tags.outputs.commit }}
            BUILD_DATE=${{ steps.tags.outputs.date }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.revision=${{ steps.tags.outputs.commit }}
            org.opencontainers.image.licenses=AGPL-3.0-only

  release:
    name: draft release
    needs: [app, binaries, installer, image]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Ours by name, not every artifact of the run: the Docker build saves a
      # record of its own (a .dockerbuild file) that is not for venues.
      - uses: actions/download-artifact@v8
        with:
          name: binaries
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: installer
          path: dist
      # The files a Linux or Docker venue needs beside the binary.
      - run: cp build/mez.service build/docker-compose.yml dist/
      - run: sh build/release.sh checksums dist "${GITHUB_REF_NAME}"
      - run: sh build/release.sh notes "${GITHUB_REF_NAME}" > notes.md
        env:
          # Whether this release carries the tablet app, for the notes to say.
          TABLET_APP: ${{ needs.app.outputs.built }}
      # A draft: nobody is told, and nothing is "latest", until a person has
      # read it and published it. Run twice for one tag, it adds to the draft
      # that is there and does not make a second.
      - name: Draft
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          prerelease=""
          case "${GITHUB_REF_NAME}" in *-*) prerelease="--prerelease" ;; esac
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" dist/* --clobber
            gh release edit "${GITHUB_REF_NAME}" --notes-file notes.md
          else
            gh release create "${GITHUB_REF_NAME}" dist/* --draft $prerelease \
              --title "mez ${GITHUB_REF_NAME}" --notes-file notes.md
          fi
