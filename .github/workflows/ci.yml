name: CI

on:
  push:
    branches: [main]
  pull_request:

# A public repo builds forks' pull requests. Give the token nothing it does not
# need.
permissions:
  contents: read

# A second push to the same branch makes the first run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: make check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          # `make check` stamps the version from `git describe`, which needs
          # tags and history. Without this it is a shallow clone with neither.
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          # Read the version from go.mod so CI and the module can never drift.
          go-version-file: go.mod
          check-latest: true

      - run: make check

      # The tablet app's embed (ADR-421) compiles only with a package in
      # place, and no `make check` has one: a stand-in, never a real app.
      - name: Build with the tablet app's tag
        run: |
          app=internal/device/tabletapp/app
          mkdir -p "$app"
          printf 'PK\003\004stand-in' > "$app/mez.apk"
          printf '{"version":"v0.0.0","version_code":1}' > "$app/app.json"
          go vet -tags tabletapp ./internal/device/tabletapp/ ./cmd/mez/
          go test -tags tabletapp ./internal/device/tabletapp/
          rm -r "$app"

  web:
    name: make build-web
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      # Typechecks and builds all three frontends, then fails if the guest
      # bundle is over 60 KB gzipped. A separate job so `make check` still
      # runs on a machine with no Node. See ADR-063.
      - run: make build-web

  android:
    name: make android
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # The Gradle daemon asks for JDK 25
      # (android-app/gradle/gradle-daemon-jvm.properties).
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      # Checks gradle-wrapper.jar against Gradle's own checksums before
      # anything runs it, and caches what Gradle downloads.
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      # The tablet app: a debug APK, unit tests and lint. The runner carries
      # the Android SDK. A separate job so `make check` never needs Java or
      # Gradle (ADR-409).
      - run: make android

      # The release build too, shrunk by R8 as a release's is, and unsigned:
      # the key is the release workflow's alone (ADR-421).
      - name: Release build, unsigned
        working-directory: android-app
        run: ./gradlew --console=plain assembleRelease
