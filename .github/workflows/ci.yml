name: CI

on:
  push:
    branches: [main]
  pull_request:

# A public repo builds forks' pull requests. Give the token nothing it does not
# need.
permissions:
  contents: read

# A second push to the same branch makes the first run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: make check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # `make check` stamps the version from `git describe`, which needs
          # tags and history. Without this it is a shallow clone with neither.
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          # Read the version from go.mod so CI and the module can never drift.
          go-version-file: go.mod
          check-latest: true

      - run: make check

  web:
    name: make build-web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      # Typechecks and builds all three frontends, then fails if the guest
      # bundle is over 60 KB gzipped. A separate job so `make check` still
      # runs on a machine with no Node. See ADR-063.
      - run: make build-web
