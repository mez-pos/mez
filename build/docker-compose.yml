# mez with its data in a named volume. From the repository root:
#
#   docker compose -f build/docker-compose.yml build
#   docker compose -f build/docker-compose.yml run --rm mez setup -name "My Cafe" -owner Priya -timezone Asia/Kolkata
#   docker compose -f build/docker-compose.yml up -d
#
# See docs/deploy.md: "Docker" for running it, "Backups" for the backup and
# for getting a venue back, "On a domain with HTTPS" for putting it behind one.

services:
  mez:
    build:
      context: ..
      dockerfile: build/Dockerfile
    image: mez:local
    restart: unless-stopped
    # mez finishes the requests in hand when it is asked to stop, and then
    # makes the backup's last copy. Docker's ten seconds is not quite enough
    # for both.
    stop_grace_period: 20s
    ports:
      - "7777:7777"
    environment:
      # An IANA name. The container's own clock is UTC, which is rarely the
      # venue's day.
      MEZ_TIMEZONE: Asia/Kolkata
      MEZ_LOG_FORMAT: json

      # Guests ordering from their phones over the internet, through a relay.
      # Optional: with these left out, nothing in mez calls the internet. The
      # address and the key come from whoever runs the relay; build/relay has
      # what it takes to run your own.
      # The third is the address guests reach this venue at, which each
      # table's code is drawn from. docs/deploy.md, "Guests ordering from
      # their phones".
      # MEZ_RELAY_URL: https://relay.example.com
      # MEZ_RELAY_KEY: mzr_the-key-you-were-given
      # MEZ_PUBLIC_URL: https://my-cafe.example.com
    volumes:
      - mez-data:/data

      # A backup to a folder. Mount the folder at /backup, then in the back
      # office choose Settings, Backup, A folder, and enter /backup.
      #
      # A folder of the host's, on another disk than Docker's. It must be
      # writable by user 65532, which is who mez runs as in the container:
      #   sudo chown 65532:65532 /mnt/usb/mez-backup
      # - /mnt/usb/mez-backup:/backup
      #
      # Or a named volume, which is on the same disk as the venue and so
      # protects against a mistake and not against the disk:
      # - mez-backup:/backup
      #
      # A backup to a bucket needs nothing here.

volumes:
  mez-data:
  # mez-backup:
